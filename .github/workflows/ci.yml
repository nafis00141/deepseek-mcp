name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      # Keep line endings exactly as committed so Windows and Linux test the same bytes.
      - name: Disable autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check (tsc --noEmit, strict)
        run: npm run typecheck

      - name: Offline tests (mock DeepSeek server, no network, no secrets)
        run: npm test

      - name: Smoke test (boots the real server over stdio)
        run: npm run smoke

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: npm audit (high and above, runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
